# CI/CD Pipeline for canopy.rs

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@nextest
    - name: Run tests
      # Note: Tests requiring semantic data (VerbNet, WordNet, etc.) will skip gracefully
      run: cargo nextest run --workspace
    - name: Run doctests
      run: cargo test --doc --workspace

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-deny
      run: cargo install cargo-deny
    - name: Run cargo deny
      run: cargo deny check

  # TODO: Re-enable after implementing dataset provisioning scripts
  # benchmark:
  #   name: Performance Benchmarks
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   steps:
  #   - uses: actions/checkout@v4
  #   - uses: dtolnay/rust-toolchain@stable
  #   - uses: Swatinem/rust-cache@v2
  #   - name: Run benchmarks
  #     run: cargo bench --workspace

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@cargo-llvm-cov
    - name: Check coverage threshold (70%)
      run: |
        cargo llvm-cov \
          --workspace \
          --fail-under-lines 70 \
          --ignore-filename-regex 'tests?\.rs$|/tests/|/benches/'
