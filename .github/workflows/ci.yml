# CI/CD Pipeline for canopy.rs

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # TODO: Re-enable test job after implementing dataset provisioning scripts
  # See docs/ROADMAP.md for tracking
  # test:
