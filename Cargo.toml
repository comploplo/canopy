[workspace]
members = [
    "crates/canopy-core",
    "crates/canopy-engine",           # Base engine infrastructure
    "crates/canopy-semantic-engines", # Consolidated semantic engines (VerbNet, FrameNet, WordNet, Lexicon, PropBank)
    "crates/canopy-treebank",         # UD Treebank dependency pattern analysis
    "crates/canopy-tokenizer",        # Semantic tokenization with consolidated engines
    "crates/canopy-events",           # Layer 2 event composition
    "crates/canopy-discourse",        # Layer 3 DRT and discourse context
    "crates/canopy-pipeline",         # Pipeline with semantic coordinator integration
    "crates/canopy-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["canopy contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/canopy-rs/canopy"
description = "High-performance semantic linguistic analysis library in Rust"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Common utilities
indexmap = { version = "2.0", features = ["serde"] }
regex = "1.10"
quick-xml = "0.37"
bincode = "1.3"
once_cell = "1.19"
tempfile = "3.8"
lru = "0.13"
rayon = { version = "1.10" }

# Testing and benchmarking
criterion = { version = "0.6", features = ["html_reports"] }
proptest = "1.7"
insta = "1.42"

# Linguistic processing
# TODO: UDPipe bindings (will be added in M2)

[package]
name = "canopy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
canopy-core = { path = "crates/canopy-core" }
canopy-engine = { path = "crates/canopy-engine" }
canopy-semantic-engines = { path = "crates/canopy-semantic-engines" }
canopy-tokenizer = { path = "crates/canopy-tokenizer" }
canopy-treebank = { path = "crates/canopy-treebank" }
canopy-events = { path = "crates/canopy-events" }
canopy-pipeline = { path = "crates/canopy-pipeline" }
canopy-discourse = { path = "crates/canopy-discourse" }
tokio = { workspace = true }
rayon = { version = "1.10", optional = true }

[features]
default = ["parallel"]
parallel = [
    "rayon",
    "canopy-engine/parallel",
    "canopy-tokenizer/parallel",
    "canopy-semantic-engines/parallel",
]

[dev-dependencies]
criterion = { workspace = true }
rand = "0.8"

[[bench]]
name = "baseline"
harness = false

[package.metadata.cargo-machete]
# These are re-exported or used indirectly
ignored = ["canopy-engine", "canopy-events", "canopy-semantic-engines", "canopy-treebank", "canopy-discourse", "canopy-pipeline", "rayon", "tokio"]
