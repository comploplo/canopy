[workspace]
members = [
    "crates/canopy",                  # Kernel crate: core types, event composition, discourse
    "crates/canopy-resources",        # Heavy loaders: VerbNet, FrameNet, WordNet, etc.
    "crates/canopy-cli",              # Command-line interface
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["canopy contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/canopy-rs/canopy"
description = "High-performance semantic linguistic analysis library in Rust"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Common utilities
indexmap = { version = "2.0", features = ["serde"] }
regex = "1.10"
quick-xml = "0.37"
bincode = "1.3"
once_cell = "1.19"
tempfile = "3.8"
lru = "0.13"
rayon = { version = "1.10" }

# Testing and benchmarking
criterion = { version = "0.6", features = ["html_reports"] }
proptest = "1.7"
insta = { version = "1.42", features = ["json", "redactions"] }

# Linguistic processing
# TODO: UDPipe bindings (will be added in M2)

# Note: This is a virtual workspace. The main `canopy` crate is at crates/canopy/
# For benchmarks and integration tests, they now live in the workspace crates.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
