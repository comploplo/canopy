[package]
name = "canopy-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for canopy"

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
canopy = { path = "../canopy" }
canopy-resources = { path = "../canopy-resources" }
tokio = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = "0.8"

[package.metadata.cargo-machete]
# Placeholder deps for future CLI implementation
ignored = ["canopy", "canopy-resources", "clap", "rand", "tokio", "tracing", "tracing-subscriber"]

[lints]
workspace = true
