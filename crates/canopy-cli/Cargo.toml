[package]
name = "canopy-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for canopy"

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
canopy-resources = { path = "../canopy-resources" }
tokio = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = "0.8"

[package.metadata.cargo-machete]
# These deps are used indirectly or for future features
ignored = ["rand", "tokio", "tracing", "tracing-subscriber"]

[lints]
workspace = true
