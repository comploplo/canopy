[package]
name = "canopy-engine"
version = "0.1.0"
edition = "2021"
authors = ["canopy.rs contributors"]
description = "Base engine infrastructure for semantic analysis - common traits, caching, and utilities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/canopy-rs/canopy"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
lru = { workspace = true }
regex = { workspace = true }
rayon = { workspace = true, optional = true }
quick-xml = { workspace = true }

# Core types from canopy-core
canopy-core = { path = "../canopy-core" }

[features]
default = ["std", "parallel"]
std = []
parallel = ["rayon"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }

# [[bench]]
# name = "engine_performance"
# harness = false
