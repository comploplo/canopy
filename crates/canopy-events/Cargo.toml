[package]
name = "canopy-events"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Layer 2 Event Composition for Canopy - Neo-Davidsonian event semantics"

[dependencies]
canopy-core = { path = "../canopy-core" }
canopy-engine = { path = "../canopy-engine" }
canopy-verbnet = { path = "../canopy-verbnet" }
canopy-framenet = { path = "../canopy-framenet" }
canopy-wordnet = { path = "../canopy-wordnet" }
canopy-treebank = { path = "../canopy-treebank" }
canopy-tokenizer = { path = "../canopy-tokenizer" }

serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.cargo-machete]
# Crate deps for future L2 features, indexmap for internal data structures
ignored = ["canopy-engine", "canopy-wordnet", "indexmap"]
