[package]
name = "canopy-framenet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "FrameNet integration for semantic analysis - FrameNet frame-based semantic parsing and analysis"

[dependencies]
# Engine infrastructure
canopy-engine = { path = "../canopy-engine", features = ["parallel"] }
canopy-core = { path = "../canopy-core" }

# Serialization and data structures
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Lazy initialization
once_cell = { workspace = true }

# XML parsing
quick-xml = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Collections and utilities
indexmap = { workspace = true }
regex = { workspace = true }

# Parallel processing
rayon = { workspace = true, optional = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
# Testing infrastructure
tempfile = { workspace = true }

[features]
default = ["std", "parallel"]
std = []
parallel = ["rayon", "canopy-engine/parallel"]
