[package]
name = "canopy-lexicon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Lexicon engine for canopy.rs - closed-class words and functional lexical items"
keywords = ["nlp", "lexicon", "function-words", "discourse", "negation"]
categories = ["text-processing", "science"]

[dependencies]
canopy-core = { path = "../canopy-core" }
canopy-engine = { path = "../canopy-engine" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
rayon = { workspace = true, optional = true }

[features]
default = []
parallel = ["dep:rayon", "canopy-engine/parallel"]

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
