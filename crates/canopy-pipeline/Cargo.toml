[package]
name = "canopy-pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Central pipeline orchestration for Canopy linguistic analysis"

[dependencies]
canopy-core = { path = "../canopy-core" }
canopy-events = { path = "../canopy-events" }
canopy-discourse = { path = "../canopy-discourse" }
canopy-tokenizer = { path = "../canopy-tokenizer" }
canopy-treebank = { path = "../canopy-treebank" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full"], optional = true }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
tracing-subscriber = { workspace = true }

[features]
default = []
async = ["tokio"]

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["full"] }
rand = "0.8"

# Binary targets removed - deprecated benchmarks replaced by examples

# Examples temporarily disabled during architectural transformation

[package.metadata.cargo-machete]
# tokio optional, tracing-subscriber for logging setup
ignored = ["tokio", "tracing-subscriber"]
