[package]
name = "canopy-tokenizer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Semantic tokenization for canopy.rs - FrameNet, VerbNet, WordNet integration"

[dependencies]
canopy-core = { path = "../canopy-core" }
canopy-engine = { path = "../canopy-engine" }
canopy-verbnet = { path = "../canopy-verbnet" }
canopy-framenet = { path = "../canopy-framenet" }
canopy-wordnet = { path = "../canopy-wordnet" }
canopy-lexicon = { path = "../canopy-lexicon" }
canopy-propbank = { path = "../canopy-propbank" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
lru = { workspace = true }
rayon = { workspace = true, optional = true }
num_cpus = "1.16"
tokio = { workspace = true, optional = true }
nlprule = { version = "0.6", optional = true }
indicatif = "0.17"

[features]
default = ["std"]
std = []
parallel = ["rayon"]
async = ["tokio"]
lemmatization = ["nlprule"]
dev = []

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
once_cell = { workspace = true }

# Most examples disabled due to API changes during architectural transformation
