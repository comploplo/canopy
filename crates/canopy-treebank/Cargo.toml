[package]
name = "canopy-treebank"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "UD Treebank integration for dependency pattern analysis - CoNLL-U parsing with semantic signature matching"

[dependencies]
# Engine infrastructure
canopy-engine = { path = "../canopy-engine" }
canopy-core = { path = "../canopy-core" }
canopy-verbnet = { path = "../canopy-verbnet" }
canopy-framenet = { path = "../canopy-framenet" }
canopy-tokenizer = { path = "../canopy-tokenizer" }

# Serialization and data structures
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# CoNLL-U parsing
conllu = "0.4"

# Collections and utilities
indexmap = { workspace = true }
lru = { workspace = true }
regex = { workspace = true }

# Logging
tracing = { workspace = true }

# Hashing for semantic signatures
ahash = "0.8"

# Date/time for index metadata
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[features]
default = ["std"]
std = []

[package.metadata.cargo-machete]
# conllu for CoNLL-U parsing, indexmap/regex/serde_json for future features, tracing via macros
ignored = ["conllu", "indexmap", "regex", "serde_json", "tracing"]
