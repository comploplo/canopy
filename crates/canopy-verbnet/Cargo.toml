[package]
name = "canopy-verbnet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "VerbNet integration for semantic analysis - VerbNet 3.4 XML parsing and verb class analysis"

[dependencies]
# Engine infrastructure
canopy-engine = { path = "../canopy-engine" }
canopy-core = { path = "../canopy-core" }

# Serialization and data structures
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# XML parsing
quick-xml = { workspace = true }

# Collections and utilities
indexmap = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
# Testing infrastructure
tempfile = { workspace = true }

[features]
default = ["std"]
std = []

[package.metadata.cargo-machete]
# regex for patterns, serde_json for serialization, tracing via macros (false positive)
ignored = ["regex", "serde_json", "tracing"]
