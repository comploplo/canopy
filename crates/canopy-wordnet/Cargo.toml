[package]
name = "canopy-wordnet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WordNet semantic engine for canopy.rs - lexical database integration"
keywords = ["nlp", "wordnet", "semantics", "lexical"]
categories = ["text-processing", "science"]

[dependencies]
canopy-core = { path = "../canopy-core" }
canopy-engine = { path = "../canopy-engine" }
serde = { workspace = true }
bincode = { workspace = true }
once_cell = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true, optional = true }

[features]
default = []
parallel = ["dep:rayon", "canopy-engine/parallel"]

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[package.metadata.cargo-machete]
# rayon optional, tracing via macros (false positive)
ignored = ["rayon", "tracing"]
