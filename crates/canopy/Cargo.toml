[package]
name = "canopy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance semantic linguistic analysis library - the kernel crate"

[dependencies]
# Essential crates
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full"], optional = true }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
tracing-subscriber = { workspace = true }

[features]
default = []
async = ["tokio"]

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["full"] }
rand = "0.8"
insta = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
canopy-resources = { path = "../canopy-resources" }

[[bench]]
name = "baseline"
harness = false

[package.metadata.cargo-machete]
# tokio optional, tracing/tracing-subscriber for logging setup, async-trait/uuid for future use
ignored = ["async-trait", "tokio", "tracing", "tracing-subscriber", "uuid"]

[lints]
workspace = true
